<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background:#090910; font-family:sans-serif;">
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="70" fill="#141422" stroke="#252538" />
  <text x="80" y="42" fill="#ffffff" font-size="20" font-weight="bold">SoundSphere [DISCOVER & SEARCH PAGE]</text>

  <!-- Title & Search Bar -->
  <text x="50" y="120" fill="#ffffff" font-size="28" font-weight="bold">Explore & Discover New Music</text>
  <rect x="50" y="145" width="1100" height="50" rx="25" fill="#141422" stroke="#8b5cf6" />
  <text x="90" y="176" fill="#64748b" font-size="16">🔍 Search by song name, artist, album, or genre...</text>

  <!-- Genre Filter Chips -->
  <rect x="50" y="215" width="80" height="36" rx="18" fill="#8b5cf6" />
  <text x="75" y="238" fill="#ffffff" font-size="13" font-weight="bold">All</text>

  <rect x="140" y="215" width="80" height="36" rx="18" fill="#141422" stroke="#252538" />
  <text x="165" y="238" fill="#94a3b8" font-size="13">Pop</text>

  <rect x="230" y="215" width="80" height="36" rx="18" fill="#141422" stroke="#252538" />
  <text x="250" y="238" fill="#94a3b8" font-size="13">Rock</text>

  <rect x="320" y="215" width="100" height="36" rx="18" fill="#141422" stroke="#252538" />
  <text x="335" y="238" fill="#94a3b8" font-size="13">Electronic</text>

  <rect x="430" y="215" width="90" height="36" rx="18" fill="#141422" stroke="#252538" />
  <text x="445" y="238" fill="#94a3b8" font-size="13">Hip Hop</text>

  <rect x="530" y="215" width="80" height="36" rx="18" fill="#141422" stroke="#252538" />
  <text x="555" y="238" fill="#94a3b8" font-size="13">Indie</text>

  <!-- Results Grid -->
  <text x="50" y="290" fill="#ffffff" font-size="18" font-weight="bold">Search Results (15 songs)</text>

  <g transform="translate(50, 310)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="250" height="180" rx="12" fill="#141422" />
    <rect x="270" y="0" width="250" height="180" rx="12" fill="#141422" />
    <rect x="540" y="0" width="250" height="180" rx="12" fill="#141422" />
    <rect x="810" y="0" width="250" height="180" rx="12" fill="#141422" />

    <!-- Row 2 -->
    <rect x="0" y="200" width="250" height="180" rx="12" fill="#141422" />
    <rect x="270" y="200" width="250" height="180" rx="12" fill="#141422" />
    <rect x="540" y="200" width="250" height="180" rx="12" fill="#141422" />
    <rect x="810" y="200" width="250" height="180" rx="12" fill="#141422" />
  </g>

  <!-- Persistent Player -->
  <rect x="0" y="720" width="1200" height="80" fill="#10101c" />
</svg>
