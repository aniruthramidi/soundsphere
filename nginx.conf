# ==============================================================================
# SoundSphere Nginx Reverse Proxy Configuration
# Production-Hardened for AWS EC2 / DigitalOcean Droplets / Ubuntu Server
# ==============================================================================

# Rate limiting zone: 20 requests per second per IP
limit_req_zone $binary_remote_addr zone=soundsphere_limit:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name soundsphere.app www.soundsphere.app;

    # Redirect all plain HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name soundsphere.app www.soundsphere.app;

    # SSL / TLS Certificate paths (managed via Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/soundsphere.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soundsphere.app/privkey.pem;

    # High-Security SSL Protocol & Cipher Suite
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip Compression for maximum network throughput
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Client body limit
    client_max_body_size 15M;

    # Root location forwarding to Express Backend
    location / {
        limit_req zone=soundsphere_limit burst=30 nodelay;

        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;

        # WebSocket and Header Forwarding
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Static assets long-term caching
    location /assets/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
