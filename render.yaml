services:
  - type: web
    name: soundsphere
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && cd server && npm install --production
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DB_PATH
        value: /var/data/soundsphere.db
      - key: CORS_ORIGIN
        value: "*"
    disk:
      name: soundsphere-sqlite-disk
      mountPath: /var/data
      sizeGB: 1
    healthCheckPath: /api/v1/health
